# The authority ceiling of the MCP server (server/mcp.cho), as tools.toml is the ceiling of the tool.
#
# A person writes and reviews this file; the authority is whatever `cancho authority` derives from the
# source (manifests/mcp.authority.json, embedded in the server and printed by `mcp introspect`), and
# `scripts/mcp.py --check` (CI) fails when a derived label is not allowed here, when `bounded` is false,
# or when an `exec` label names a directory other than the one the binary is baked with. The derived set
# may be smaller than the ceiling, never larger.
#
# What the server is: it starts one binary (`exec`, narrowed to the directory it is built with), feeds it
# the call's `stdin` text, if it has one (docs/mcp.md section 12), and reads what it writes through its pipes (`pipe_read`, `pipe_write`, `poll`) under a
# deadline (`clock`), kills it (`child_signal`), reads its own standard input and writes its standard
# output and error. It holds no `fs_*`, `file_*` or `dir_*` (it reads no file; the tool reads, beneath
# `--root`), and nothing that reaches the network, a foreign function, or the environment.

[mcp]
allow = ["args", "child_signal", "clock", "err_write", "exec(\"/opt/cancho-fetch/bin\")", "heap", "io_read", "io_write", "pipe_read", "pipe_write", "poll"]
forbid = ["ffi", "net_out", "net_in", "fs_read", "fs_write", "file_read", "file_write", "dir_read", "dir_write", "env_read"]
